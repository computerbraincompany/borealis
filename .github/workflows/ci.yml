name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Install Playwright Chromium
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Verify repository
        run: ./scripts/verify.sh

  package-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Verify desktop shell, renderer, and native ABI
        run: npm --prefix desktop run verify

      - name: Package unsigned arm64 app
        run: npm --prefix desktop run package:unsigned

      - name: Load native addons from the packaged app
        run: npm --prefix desktop run package:native:smoke

      - name: Upload unsigned macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: borealis-macos-arm64-unsigned
          path: |
            desktop/release/Borealis-*-macOS-arm64.dmg
            desktop/release/Borealis-*-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7

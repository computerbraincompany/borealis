# Borealis infrastructure. Only Postgres with pgvector is required.
# Zitadel/Redpanda are commented out as optional add-ons per the objective.
name: borealis

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: borealis-postgres
    environment:
      POSTGRES_USER: borealis
      POSTGRES_PASSWORD: borealis_password
      POSTGRES_DB: borealis
    ports:
      # host 5433 (local Postgres may own 5432) -> container 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - borealis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borealis"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LiteLLM proxy is run locally via `uv run litellm` (see scripts/dev.sh) so it
  # shares the Python env with the report service. The Docker route is optional:
  #
  #   litellm:
  #     image: ghcr.io/berriai/liteLLM:main-latest
  #     ports: ["4000:4000"]
  #     volumes: ["./python/litellm.yaml:/app/config.yaml"]
  #     command: ["--config", "/app/config.yaml"]
  #
  # Optional connect-and-go IAM for SSO-style auth (not required for MVP):
  #   zitadel / redpanda — see README.

volumes:
  borealis_pgdata:
    name: borealis_pgdata

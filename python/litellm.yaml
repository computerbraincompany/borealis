# LiteLLM proxy config for the default loopback-only LM Studio setup.
# Credentials are injected at runtime; never commit usable proxy/provider keys.
model_list:
  - model_name: qwen-chat
    litellm_params:
      model: openai/qwen/qwen3.6-35b-a3b
      api_base: http://127.0.0.1:1234/v1
      api_key: os.environ/LM_STUDIO_API_KEY
      rpm: 100
  - model_name: qwen-27b
    litellm_params:
      model: openai/qwen3.8-27b-obliterated
      api_base: http://127.0.0.1:1234/v1
      api_key: os.environ/LM_STUDIO_API_KEY
  - model_name: nemotron
    litellm_params:
      model: openai/nvidia/nemotron-3-nano
      api_base: http://127.0.0.1:1234/v1
      api_key: os.environ/LM_STUDIO_API_KEY
  - model_name: nomic-embed
    litellm_params:
      model: openai/text-embedding-nomic-embed-text-v1.5
      api_base: http://127.0.0.1:1234/v1
      api_key: os.environ/LM_STUDIO_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  drop_params: true
